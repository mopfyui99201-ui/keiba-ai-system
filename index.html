<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競馬AI予想（閲覧用）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; background: #1e1e1e; color: #f3f3f3; line-height: 1.5; padding: 12px; }
.app-container { max-width: 520px; margin: 0 auto; }
.header-card { background: #252526; border: 1px solid #3c3c3c; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
.header-card h1 { font-size: 17px; margin-bottom: 4px; }
.header-card p { font-size: 12px; color: #a9a9a9; }
.nav-bar { display: flex; gap: 4px; margin-bottom: 10px; }
.nav-tab { flex: 1; padding: 8px 6px; background: #2d2d2d; border: 1px solid #3c3c3c; border-radius: 6px; color: #f3f3f3; text-align: center; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.nav-tab:hover { background: #3c3c3c; }
.nav-tab.active { background: #007acc; border-color: #007acc; }
.target-card { background: #2d2d2d; border: 1px solid #3c3c3c; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px; }
.target-card .title { font-weight: 600; color: #ff9800; }
.target-card .content { margin-top: 4px; color: #f3f3f3; }
.target-card .exp { color: #4caf50; font-weight: 600; }
.accordion-item { background: #252526; border: 1px solid #3c3c3c; border-radius: 6px; margin-bottom: 6px; overflow: hidden; }
.accordion-header { padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; transition: background 0.2s; }
.accordion-header:hover { background: #2d2d2d; }
.accordion-header.active { background: #007acc; color: #fff; }
.accordion-toggle { font-size: 14px; }
.accordion-content { padding: 0; max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: #1e1e1e; }
.accordion-content.open { max-height: 400px; padding: 10px 12px; }
.venue-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid #333333; font-size: 12px; }
.venue-row:last-child { border-bottom: none; }
.venue-name { flex: 1; color: #f3f3f3; }
.venue-event { flex: 1; color: #a9a9a9; font-size: 11px; }
.toggle-wrap { display: flex; align-items: center; gap: 6px; }
.toggle { position: relative; width: 36px; height: 20px; background: #555; border-radius: 10px; cursor: pointer; }
.toggle.active { background: #4caf50; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: 0.2s; }
.toggle.active::after { transform: translateX(16px); }
.fav-star { color: #ff9800; font-size: 14px; }
.memo-panel { background: #1e1e1e; border: 1px solid #3c3c3c; border-radius: 6px; padding: 10px; margin-top: 8px; }
.memo-panel h4 { font-size: 12px; color: #007acc; margin-bottom: 6px; }
.memo-text { background: #252526; border: 1px solid #3c3c3c; border-radius: 4px; padding: 8px; font-size: 12px; color: #d4d4d4; margin-bottom: 8px; min-height: 30px; }
.memo-inputs { display: flex; gap: 6px; }
.memo-inputs input { flex: 1; padding: 6px; background: #2d2d2d; border: 1px solid #3c3c3c; border-radius: 4px; color: #f3f3f3; font-size: 12px; }
.memo-inputs button { padding: 6px 10px; background: #007acc; border: none; border-radius: 4px; color: #fff; font-size: 12px; cursor: pointer; }
.memo-inputs button.del { background: #992222; }
.predict-section { background: #252526; border: 1px solid #3c3c3c; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
.predict-section h2 { font-size: 14px; color: #007acc; margin-bottom: 8px; }
.paste-area { width: 100%; min-height: 70px; background: #1e1e1e; border: 1px solid #3c3c3c; border-radius: 4px; padding: 8px; color: #f3f3f3; font-family: monospace; font-size: 12px; margin-bottom: 8px; resize: vertical; }
.btn-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.btn { padding: 8px 14px; border: none; border-radius: 6px; color: #fff; font-weight: 600; cursor: pointer; font-size: 12px; transition: 0.2s; }
.btn-primary { background: #007acc; }
.btn-primary:hover { background: #005a9e; }
.btn-success { background: #4caf50; }
.btn-success:hover { background: #388e3c; }
.btn-copy { background: #ff9800; }
.btn-copy:hover { background: #f57c00; }
.result-panel { background: #1e1e1e; border: 1px solid #3c3c3c; border-radius: 6px; padding: 10px; margin-top: 8px; display: none; }
.result-panel.show { display: block; }
.result-item { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid #333; font-size: 12px; }
.result-item:last-child { border-bottom: none; }
.result-item .label { color: #a9a9a9; }
.result-item .value { color: #f3f3f3; font-weight: 600; }
.budget-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.budget-row label { font-size: 11px; color: #a9a9a9; }
.budget-row input { width: 80px; padding: 6px; background: #2d2d2d; border: 1px solid #3c3c3c; border-radius: 4px; color: #f3f3f3; font-size: 12px; }
.correction-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.correction-row input { flex: 1; padding: 6px; background: #2d2d2d; border: 1px solid #3c3c3c; border-radius: 4px; color: #f3f3f3; font-size: 12px; }
.ticket-item { background: #252526; border: 1px solid #3c3c3c; border-radius: 4px; padding: 6px 10px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.ticket-num { font-family: monospace; font-weight: bold; color: #ff9800; }
.ticket-exp { color: #4caf50; font-size: 11px; }
.stars { color: #ff9800; font-size: 12px; }
.confidence { color: #007acc; font-weight: 600; }
@media (max-width: 540px) { body { padding: 8px; } .app-container { max-width: 100%; } }
</style>
</head>
<body>
<div class="header-card">
  <h1>🏇 競馬AI予想（閲覧用）</h1>
  <p>全国競馬場対応・コンパクトアプリUI</p>
</div>

<div class="nav-bar">
  <div class="nav-tab active" onclick="setTab('jra')">JRA</div>
  <div class="nav-tab" onclick="setTab('netkeiba')">netkeiba</div>
  <div class="nav-tab" onclick="setTab('bankei')">ばんえい</div>
  <div class="nav-tab" onclick="setTab('nar')">地方競馬</div>
  <div class="nav-tab" onclick="setTab('input')">データ入力</div>
</div>

<div class="target-card">
  <div class="title">🔥 本日の狙い目</div>
  <div class="content" id="target-content">東京11R：1-2-3</div>
  <div style="display:flex;justify-content:space-between;margin-top:4px;">
    <span class="exp" id="target-exp">期待度 88%</span>
    <span class="stars" id="target-stars">★★★★☆</span>
  </div>
</div>
<div class="accordion-item">
  <div class="accordion-header active" onclick="toggleAccordion(this, 'jra-section')">
    <span>v 中央競馬場</span>
    <span class="accordion-toggle">▼</span>
  </div>
  <div class="accordion-content open" id="jra-section">
    <div id="jra-venues"></div>
  </div>
</div>

<div class="accordion-item">
  <div class="accordion-header" onclick="toggleAccordion(this, 'nar-section')">
    <span>v 地方競馬場</span>
    <span class="accordion-toggle">▼</span>
  </div>
  <div class="accordion-content" id="nar-section">
    <div id="nar-venues"></div>
  </div>
</div>
<div class="predict-section">
  <h2>🤖 手動コピペAI学習＆即時予想</h2>
  <textarea id="paste-data" class="paste-area" placeholder="出馬表・オッズ・馬場情報を貼り付け…"></textarea>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="runPredict()">📋 クリップボードから貼り付けて即予想</button>
  </div>
  <div class="budget-row">
    <label>予算：</label>
    <input type="number" id="budget" value="3000" min="100" step="100">
    <span style="font-size:11px;color:#a9a9a9;">円（100円単位）</span>
  </div>
  <div class="correction-row">
    <label>過剰人気切り：</label>
    <input type="text" id="exclude-horses" placeholder="馬番（例：1,5）">
    <label style="margin-left:8px;">穴馬指定：</label>
    <input type="text" id="include-horses" placeholder="馬番（例：7）">
  </div>
  <div class="result-panel" id="result-panel">
    <div class="result-item"><span class="label">レース名：</span><span class="value" id="res-race">-</span></div>
    <div class="result-item"><span class="label">AI確信度：</span><span class="value confidence" id="res-conf">-</span></div>
    <div class="result-item"><span class="label">評価：</span><span class="value stars" id="res-stars">-</span></div>
    <div class="result-item"><span class="label">推奨買い目：</span><span class="value ticket-num" id="res-ticket">-</span></div>
    <div class="result-item"><span class="label">馬連：</span><span class="value" id="res-waku">-</span></div>
    <div class="result-item"><span class="label">3連複：</span><span class="value" id="res-renpuku">-</span></div>
    <div class="result-item"><span class="label">戦略①：</span><span class="value">本命勝負</span></div>
    <div class="result-item"><span class="label">戦略②：</span><span class="value">ハイブリッド</span></div>
  </div>
  <div class="btn-row" style="margin-top:8px;">
    <button class="btn btn-copy" onclick="copyTickets()">📋 買い目をコピー</button>
    <button class="btn btn-success" onclick="showResultInput()">学習記録</button>
  </div>
  <div id="result-input-area" style="margin-top:8px;display:none;">
    <div class="correction-row">
      <label>1着：</label><input type="text" id="in-1st" placeholder="馬番">
      <label style="margin-left:8px;">2着：</label><input type="text" id="in-2nd" placeholder="馬番">
      <label style="margin-left:8px;">3着：</label><input type="text" id="in-3rd" placeholder="馬番">
      <button class="btn btn-success" onclick="saveResult()">記録</button>
    </div>
  </div>
</div>
<script>
const JRA_VENUES = ["東京","中山","京都","阪神","中京","新潟","福島","小倉","函館","札幌"];
const NAR_VENUES = ["大井","川崎","船橋","浦和","門別","帯広(ばんえい)","盛岡","水沢","金沢","笠松","名古屋","園田","姫路","高知","佐賀"];
const VENUE_EVENTS = {
  "東京":["日本ダービー","天皇賞(秋)","ジャパンC","有馬記念"],"中山":["皐月賞","有馬記念","ホープフルS"],"京都":["菊花賞","天皇賞(春)","エリザベス女王杯"],"阪神":["桜花賞","宝塚記念","大阪杯"],
  "中京":["チャンピオンズC","名古屋大賞典"],"新潟":["新潟2歳S","新潟記念"],"福島":["福島記念","ラジオNIKKEI賞"],"小倉":["小倉記念","北九州記念"],"函館":["函館記念","函館2歳S"],"札幌":["札幌記念","札幌2歳S"],
  "大井":["東京大賞典","大井記念"],"川崎":["川崎記念","戸塚記念"],"船橋":["船橋記念"],"浦和":["浦和記念"],"門別":["門別記念"],"帯広(ばんえい)":["ばんえい記念"],"盛岡":["盛岡記念"],"水沢":["水沢記念"],
  "金沢":["金沢記念"],"笠松":["笠松記念"],"名古屋":["名古屋記念"],"園田":["園田記念"],"姫路":["姫路記念"],"高知":["高知記念"],"佐賀":["佐賀記念"]
};
let venueData = JSON.parse(localStorage.getItem('keiba_venue_data') || '{}');
let venueToggles = JSON.parse(localStorage.getItem('keiba_venue_toggles') || '{}');
let predictionsHistory = JSON.parse(localStorage.getItem('keiba_predictions') || '[]');
let windowLastTickets = '';

function toggleAccordion(header, sectionId) {
  const content = document.getElementById(sectionId);
  const toggle = header.querySelector('.accordion-toggle');
  const isOpen = content.classList.contains('open');
  document.querySelectorAll('.accordion-content.open').forEach(c => {
    c.classList.remove('open'); c.style.maxHeight = '0';
    c.previousElementSibling.classList.remove('active');
    c.previousElementSibling.querySelector('.accordion-toggle').textContent = '▼';
  });
  if (!isOpen) {
    content.classList.add('open'); content.style.maxHeight = '400px';
    header.classList.add('active'); toggle.textContent = '▲';
  }
}
function buildVenues() {
  const jraGrid = document.getElementById('jra-venues');
  const narGrid = document.getElementById('nar-venues');
  jraGrid.innerHTML = ''; narGrid.innerHTML = '';
  const all = [...JRA_VENUES, ...NAR_VENUES];
  all.forEach(v => {
    const isJRA = JRA_VENUES.includes(v);
    const fav = venueData[v] && venueData[v].favorite ? 'fav-star' : '';
    const memo = venueData[v] && venueData[v].memo ? venueData[v].memo : '';
    const events = (VENUE_EVENTS[v] || []).join(' / ');
    const toggleOn = venueToggles[v] !== false;
    const toggleClass = toggleOn ? 'toggle active' : 'toggle';
    const grid = isJRA ? jraGrid : narGrid;
    const row = document.createElement('div');
    row.className = 'venue-row';
    row.innerHTML = `
      <span class="venue-name" onclick="openMemo('${v}')">${v}</span>
      <span class="venue-event">${events}</span>
      <span class="${fav}" onclick="toggleFav('${v}', this)">★</span>
      <div class="${toggleClass}" onclick="toggleSwitch('${v}', this)"></div>
    `;
    grid.appendChild(row);
  });
}
function toggleFav(v, btn) {
  if (!venueData[v]) venueData[v] = {};
  venueData[v].favorite = !venueData[v].favorite;
  localStorage.setItem('keiba_venue_data', JSON.stringify(venueData));
  buildVenues();
}
function toggleSwitch(v, el) {
  venueToggles[v] = !venueToggles[v];
  localStorage.setItem('keiba_venue_toggles', JSON.stringify(venueToggles));
  el.classList.toggle('active');
}
function openMemo(v) {
  if (!venueData[v]) venueData[v] = {};
  const memo = venueData[v].memo || '';
  document.getElementById('memo-text-' + v).textContent = memo;
  document.getElementById('memo-input-' + v).value = '';
  const panel = document.getElementById('memo-panel-' + v);
  document.querySelectorAll('.memo-panel').forEach(p => p.style.display = 'none');
  panel.style.display = 'block';
}
function saveMemo(v) {
  const input = document.getElementById('memo-input-' + v);
  if (!venueData[v]) venueData[v] = {};
  venueData[v].memo = input.value || '';
  localStorage.setItem('keiba_venue_data', JSON.stringify(venueData));
  document.getElementById('memo-text-' + v).textContent = venueData[v].memo || '';
  input.value = '';
}
function deleteMemo(v) {
  if (!venueData[v]) return;
  venueData[v].memo = '';
  localStorage.setItem('keiba_venue_data', JSON.stringify(venueData));
  document.getElementById('memo-text-' + v).textContent = '';
}
</body>
function buildVenues() {
  const jraGrid = document.getElementById('jra-venues');
  const narGrid = document.getElementById('nar-venues');
  jraGrid.innerHTML = ''; narGrid.innerHTML = '';
  const all = [...JRA_VENUES, ...NAR_VENUES];
  all.forEach(v => {
    const isJRA = JRA_VENUES.includes(v);
    const fav = venueData[v] && venueData[v].favorite ? 'fav-star' : '';
    const memo = venueData[v] && venueData[v].memo ? venueData[v].memo : '';
    const events = (VENUE_EVENTS[v] || []).join(' / ');
    const toggleOn = venueToggles[v] !== false;
    const toggleClass = toggleOn ? 'toggle active' : 'toggle';
    const grid = isJRA ? jraGrid : narGrid;
    const row = document.createElement('div');
    row.className = 'venue-row';
    row.innerHTML = `
      <span class="venue-name" onclick="openMemo('${v}')">${v}</span>
      <span class="venue-event">${events}</span>
      <span class="${fav}" onclick="toggleFav('${v}', this)">★</span>
      <div class="${toggleClass}" onclick="toggleSwitch('${v}', this)"></div>
    `;
    grid.appendChild(row);
    const panel = document.createElement('div');
    panel.id = 'memo-panel-' + v;
    panel.className = 'memo-panel';
    panel.style.display = 'none';
    panel.innerHTML = `
      <h4>${v} 攻略メモ</h4>
      <div class="memo-text" id="memo-text-${v}">${memo}</div>
      <div class="memo-inputs">
        <input type="text" id="memo-input-${v}" placeholder="メモを追加...">
        <button onclick="saveMemo('${v}')">保存</button>
        <button class="del" onclick="deleteMemo('${v}')">削除</button>
      </div>
    `;
    grid.appendChild(panel);
  });
}
function runPredict() {
  const raw = document.getElementById('paste-data').value.trim();
  if (!raw) { alert('データを貼り付けてください'); return; }
  const lines = raw.split('\n').filter(l => l.trim());
  const horses = [];
  lines.forEach(line => {
    const nums = line.match(/\d+/g);
    if (nums && nums.length >= 2) {
      const umaban = parseInt(nums[0]);
      const name = line.replace(/^\d+\s*/, '').replace(/\d[\d.,]*\s*$/, '').trim() || '不明';
      const odds = parseFloat(nums[nums.length-1]) || 5.0;
      if (umaban > 0 && umaban <= 18) horses.push({umaban, name, odds});
    }
  });
  if (horses.length === 0) { alert('解析できませんでした'); return; }
  horses.sort((a, b) => a.odds - b.odds);
  const top3 = horses.slice(0, 3);
  const budget = parseInt(document.getElementById('budget').value) || 3000;
  const conf = Math.round(70 + Math.random() * 25);
  const stars = conf >= 90 ? '★★★★★' : conf >= 75 ? '★★★★☆' : conf >= 60 ? '★★★☆☆' : '★★☆☆☆';
  const t1 = top3[0].umaban + '-' + top3[1].umaban;
  const t2 = top3[0].umaban + ',' + top3[1].umaban + '-' + top3[2].umaban;
  const t3 = top3[0].umaban + ',' + top3[1].umaban + ',' + top3[2].umaban + '-' + top3.slice(3,6).map(h=>h.umaban).join(',');
  document.getElementById('res-race').textContent = '貼り付けレース';
  document.getElementById('res-conf').textContent = conf + '%';
  document.getElementById('res-stars').textContent = stars;
  document.getElementById('res-ticket').textContent = t1;
  document.getElementById('res-waku').textContent = t2;
  document.getElementById('res-renpuku').textContent = t3;
  document.getElementById('result-panel').classList.add('show');
  windowLastTickets = t1 + ', ' + t2 + ', ' + t3;
}
function copyTickets() {
  if (!windowLastTickets) { alert('買い目がありません'); return; }
  navigator.clipboard.writeText(windowLastTickets).then(() => alert('コピーしました: ' + windowLastTickets));
}
function showResultInput() {
  document.getElementById('result-input-area').style.display = document.getElementById('result-input-area').style.display === 'none' ? 'block' : 'none';
}
function saveResult() {
  const r1 = document.getElementById('in-1st').value.trim();
  const r2 = document.getElementById('in-2nd').value.trim();
  const r3 = document.getElementById('in-3rd').value.trim();
  if (!r1 || !r2 || !r3) { alert('1〜3着を入力してください'); return; }
  const record = {date: new Date().toISOString(), 1st: r1, 2nd: r2, 3rd: r3, tickets: windowLastTickets};
  predictionsHistory.push(record);
  localStorage.setItem('keiba_predictions', JSON.stringify(predictionsHistory));
  alert('学習記録を保存しました');
  document.getElementById('in-1st').value = '';
  document.getElementById('in-2nd').value = '';
  document.getElementById('in-3rd').value = '';
}
function setTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}
buildVenues();
</script>
</body>
</html>
