<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競馬AI予想システム - Elizabeth Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 認証オーバーレイ -->
    <div id="auth-overlay" class="auth-overlay active">
        <div class="auth-card">
            <h1>🔐 競馬AI予想システム</h1>
            <p>暗証番号を入力してください</p>
            <input type="password" id="password-input" placeholder="パスワードを入力">
            <button id="auth-btn" class="auth-btn">ログイン</button>
            <div id="auth-error" class="auth-error"></div>
        </div>
    </div>

    <!-- メインコンテンツ（認証後表示） -->
    <div id="main-content" class="main-content" style="display: none;">
        <header class="app-header">
            <h1>🏇 競馬AI予想システム - Elizabeth Web</h1>
            <div class="header-info" id="header-info">
                最終更新: <span id="last-updated">-</span>
            </div>
        </header>

        <!-- メニューバー -->
        <nav class="main-nav">
            <button class="nav-btn active" data-section="jra">🏇 中央競馬（JRA）</button>
            <button class="nav-btn" data-section="nar">🏁 地方競馬（NAR）</button>
            <button class="nav-btn" data-section="bankei">🐴 ばんえい競馬（帯広）</button>
            <button class="nav-btn" data-section="top">⭐ ★4以上（高期待値）</button>
            <button class="nav-btn" data-section="stats">📊 成績・学習ログ</button>
            <button class="nav-btn admin-btn" data-section="admin">⚙️ 管理者メニュー</button>
        </nav>

        <!-- 絞り込みフィルター -->
        <div class="filter-bar" id="filter-bar" style="display: none;">
            <label>会場: <select id="filter-venue"><option value="">全会場</option></select></label>
            <label>日付: <select id="filter-date"><option value="">全日付</option></select></label>
            <button id="filter-reset" class="btn-reset">リセット</button>
        </div>

        <!-- セクション：中央競馬 -->
        <section id="section-jra" class="race-section active">
            <div class="section-header">
                <h2>🏇 中央競馬（JRA）予想一覧</h2>
                <span class="badge" id="count-jra">0 レース</span>
            </div>
            <div class="card-grid" id="grid-jra"></div>
        </section>

        <!-- セクション：地方競馬 -->
        <section id="section-nar" class="race-section">
            <div class="section-header">
                <h2>🏁 地方競馬（NAR）予想一覧</h2>
                <span class="badge" id="count-nar">0 レース</span>
            </div>
            <div class="card-grid" id="grid-nar"></div>
        </section>

        <!-- セクション：ばんえい -->
        <section id="section-bankei" class="race-section">
            <div class="section-header">
                <h2>🐴 ばんえい競馬（帯広）予想一覧</h2>
                <span class="badge" id="count-bankei">0 レース</span>
            </div>
            <div class="card-grid" id="grid-bankei"></div>
        </section>

        <!-- セクション：★4以上 -->
        <section id="section-top" class="race-section">
            <div class="section-header">
                <h2>⭐ ★4以上（高期待値ピックアップ）</h2>
                <span class="badge" id="count-top">0 レース</span>
            </div>
            <div class="card-grid" id="grid-top"></div>
        </section>

        <!-- セクション：成績・学習ログ -->
        <section id="section-stats" class="race-section">
            <div class="section-header">
                <h2>📊 成績・学習ログ</h2>
                <span class="badge" id="count-stats">0 会場</span>
            </div>
            <div class="stats-grid" id="grid-stats"></div>
            <div class="learning-log" id="log-stats"></div>
        </section>

        <!-- セクション：管理者メニュー -->
        <section id="section-admin" class="race-section admin-section">
            <div class="section-header">
                <h2>⚙️ 管理者メニュー</h2>
                <span class="badge admin-badge">管理者専用</span>
            </div>
            <div class="admin-grid">
                <div class="admin-card">
                    <h3>📊 システムステータス</h3>
                    <div class="status-item"><span>最終実行:</span><span id="status-last-run">-</span></div>
                    <div class="status-item"><span>取得レース数:</span><span id="status-race-count">-</span></div>
                    <div class="status-item"><span>データ更新:</span><span id="status-data-updated">-</span></div>
                </div>
                <div class="admin-card">
                    <h3>🎯 AI重み付け設定</h3>
                    <div id="admin-weights"></div>
                    <button class="btn-reset-weights" id="btn-reset-weights">重みをリセット</button>
                </div>
                <div class="admin-card">
                    <h3>🔧 操作</h3>
                    <div class="admin-links">
                        <a href="https://github.com/mopfyui99201-ui/keiba-ai-system/actions" target="_blank" class="admin-link">🚀 GitHub Actions手動実行</a>
                        <button class="admin-link" id="btn-export-history">📤 履歴エクスポート</button>
                        <button class="admin-link" id="btn-reset-history">🗑️ 履歴リセット</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="auth.js"></script>
</body>
</html>
