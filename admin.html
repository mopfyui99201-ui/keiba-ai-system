<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競馬AI管理コンソール（管理者専用）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; background: #1e1e1e; color: #f3f3f3; line-height: 1.5; padding: 12px; }
.app-container { max-width: 520px; margin: 0 auto; }
.header-card { background: linear-gradient(135deg, #992222 0%, #661111 100%); border: 1px solid #992222; border-radius: 10px; padding: 14px; margin-bottom: 10px; text-align: center; }
.header-card h1 { font-size: 17px; margin-bottom: 4px; }
.header-card p { font-size: 12px; color: #f8a9a9; }
.status-bar { background: #2d2d2d; border: 2px solid #4caf50; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: #4caf50; }
.card { background: #252526; border: 1px solid #3c3c3c; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
.card h2 { font-size: 14px; color: #007acc; margin-bottom: 8px; border-bottom: 1px solid #3c3c3c; padding-bottom: 4px; }
.btn-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.btn { padding: 10px 16px; border: none; border-radius: 6px; color: #fff; font-weight: 600; cursor: pointer; font-size: 13px; transition: 0.2s; flex: 1; min-width: 140px; }
.btn-main { background: #333333; }
.btn-main:hover { background: #444444; }
.btn-danger { background: #992222; }
.btn-danger:hover { background: #661111; }
.btn-file { background: #6366f1; }
.btn-file:hover { background: #4f46e5; }
.result { margin-top: 8px; padding: 8px; border-radius: 4px; display: none; font-size: 12px; }
.result.success { background: rgba(76,175,80,0.2); border: 1px solid #4caf50; color: #c8e6c9; }
.result.error { background: rgba(153,34,34,0.2); border: 1px solid #992222; color: #f8a9a9; }
.log-box { background: #1e1e1e; border: 1px solid #3c3c3c; border-radius: 6px; padding: 10px; margin-top: 8px; font-family: monospace; font-size: 11px; color: #a9a9a9; height: 150px; overflow-y: auto; }
.warning { color: #ff9800; font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="app-container">
  <div class="header-card">
    <h1>⚙️ 競馬AI管理コンソール</h1>
    <p>localhost専用 - 管理者専用サイト</p>
  </div>

  <div class="status-bar">
    <span>✅ 127.0.0.1:8765 稼働中 🟢</span>
  </div>

  <div class="card">
    <h2>📋 メイン操作</h2>
    <div class="btn-row">
      <button class="btn btn-main" onclick="apiCall('git-push')">GitHub公開反映 (Push)</button>
      <button class="btn btn-file" onclick="downloadBackup()">ZIPバックアップ作成</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-main" onclick="alert('設定編集はサーバー側ファイルを直接編集してください')">システム設定編集</button>
      <button class="btn btn-main" onclick="apiCall('restore')">学習データ管理</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-main" onclick="loadLogs()">ログ表示</button>
    </div>
    <div class="result" id="result-main"></div>
  </div>

  <div class="card">
    <h2>⚠️ 危険操作</h2>
    <div class="warning">この操作は元に戻せません。バックアップを推奨します。</div>
    <div class="btn-row">
      <button class="btn btn-danger" onclick="apiCall('cleanup')">公開データ削除</button>
      <button class="btn btn-danger" onclick="apiCall('reset')">システム根本リセット</button>
    </div>
    <div class="result" id="result-danger"></div>
  </div>

  <div class="card">
    <h2>📜 実行ログ</h2>
    <div class="log-box" id="log-box">ログを読み込み中...</div>
  </div>
</div>
<script>
function apiCall(endpoint) {
  const resultDiv = document.getElementById('result-' + endpoint);
  resultDiv.style.display = 'block';
  resultDiv.className = 'result';
  resultDiv.textContent = '処理中...';
  fetch('/api/' + endpoint, { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      resultDiv.className = data.success ? 'result success' : 'result error';
      resultDiv.textContent = JSON.stringify(data, null, 2);
    })
    .catch(err => {
      resultDiv.className = 'result error';
      resultDiv.textContent = 'エラー: ' + err;
    });
}
function downloadBackup() {
  fetch('/api/backup', { method: 'POST' })
    .then(r => r.blob())
    .then(blob => {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'keiba_backup_' + new Date().toISOString().slice(0, 16) + '.json';
      document.body.appendChild(a); a.click(); window.URL.revokeObjectURL(url);
    });
}
function loadLogs() {
  fetch('/api/logs')
    .then(r => r.json())
    .then(data => {
      document.getElementById('log-box').textContent = data.logs.join('');
    })
    .catch(err => { document.getElementById('log-box').textContent = 'エラー: ' + err; });
}
loadLogs();
setInterval(loadLogs, 5000);
</script>
</body>
</html>
