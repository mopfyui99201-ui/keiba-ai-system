<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競馬AI管理コンソール - 管理者専用</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; background: #1e1e1e; color: #ffffff; line-height: 1.5; padding: 12px; }
.app-container { max-width: 480px; margin: 0 auto; }
.title-bar { background: #2d2d30; border: 1px solid #3e3e42; border-radius: 10px 10px 0 0; padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
.traffic { display: flex; gap: 6px; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.traffic .r { background: #ff5f57; } .traffic .y { background: #febc2e; } .traffic .g { background: #28c840; }
.title-bar h1 { font-size: 14px; font-weight: 600; color: #cccccc; flex: 1; text-align: center; margin-right: 40px; }
.status-bar { background: #252526; border: 2px solid #30d158; border-top: none; border-radius: 0 0 8px 8px; padding: 9px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: #30d158; }
.card { background: #2d2d30; border: 1px solid #3e3e42; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.card h2 { font-size: 13px; color: #0a84ff; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #3e3e42; }
.btn-col { display: flex; flex-direction: column; gap: 8px; }
.btn { display: block; width: 100%; padding: 12px 16px; border: 1px solid #3e3e42; border-radius: 8px; background: #252526; color: #ffffff; font-weight: 600; cursor: pointer; font-size: 13px; text-align: center; transition: all 0.15s; }
.btn:hover { background: #3e3e42; }
.btn:active { background: #0a5ea8; border-color: #0a5ea8; }
.divider { border: none; border-top: 1px solid #3e3e42; margin: 12px 0; }
.btn-danger { background: #b91c1c; border-color: #991b1b; color: #ffffff; }
.btn-danger:hover { background: #991b1b; }
.result { margin-top: 10px; padding: 10px; border-radius: 6px; display: none; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
.result.success { background: rgba(48,209,88,0.12); border: 1px solid #30d158; color: #30d158; }
.result.error { background: rgba(185,28,28,0.15); border: 1px solid #b91c1c; color: #ff9f0a; }
.log-box { background: #1e1e1e; border: 1px solid #3e3e42; border-radius: 8px; padding: 10px; margin-top: 10px; font-family: Menlo, monospace; font-size: 11px; color: #8e8e93; height: 170px; overflow-y: auto; white-space: pre-wrap; }
.file-list { font-size: 12px; color: #cccccc; margin-bottom: 8px; }
.file-list div { padding: 2px 0; }
@media (max-width: 480px) { body { padding: 8px; } .app-container { max-width: 100%; } }
</style>
</head>
<body>
<div class="app-container">
  <div class="title-bar">
    <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <h1>競馬AI管理コンソール - 管理者専用</h1>
  </div>

  <div class="status-bar">
    <span>✅ 127.0.0.1:8765 稼働中 🟢</span>
    <span id="view-stats" style="font-size:11px;color:#8e8e93;font-weight:400;">👀 閲覧数：取得中…</span>
    <span id="status-detail" style="font-size:11px;color:#8e8e93;font-weight:400;">data/ -</span>
  </div>

  <div class="card">
    <h2>🌐 Web公開ステータス</h2>
    <div id="web-status-text" style="font-size:13px;margin-bottom:10px;color:#cccccc;">確認中...</div>
    <div class="btn-col">
      <button class="btn" id="btn-publish" onclick="webAction('web-publish')">🌐 公開する（最新index.htmlを反映）</button>
      <button class="btn" id="btn-unpublish" onclick="webAction('web-unpublish')">⛔ 停止する（メンテナンス画面にする）</button>
    </div>
    <div style="margin-top:10px;font-size:12px;">
      <div style="color:#8e8e93;margin-bottom:4px;">公開URL：</div>
      <a id="pages-link" href="#" target="_blank" rel="noopener" style="color:#64d2ff;word-break:break-all;">https://mopfyui99201-ui.github.io/keiba-ai-system/</a>
      <button class="btn" style="margin-top:6px;padding:6px 10px;font-size:11px;" onclick="copyPagesUrl()">📋 URLをコピー</button>
    </div>
    <div class="result" id="result-web"></div>
  </div>

  <div class="card">
    <h2>🔄 競馬情報・自動収集</h2>
    <div class="btn-col">
      <button class="btn" onclick="keibaUpdate()">🔄 競馬情報を最新に更新（外部情報収集）</button>
      <button class="btn" onclick="syncViewer()">📤 閲覧者サイトへ最新情報を反映（公開更新）</button>
      <button class="btn" onclick="copyAllAiText()">📋 全体のAI学習用テキストをコピー</button>
    </div>
    <div class="result" id="result-keiba"></div>
    <div id="keiba-cards" style="margin-top:10px;"></div>
  </div>

  <div class="card">
    <h2>📋 メイン操作</h2>
    <div class="btn-col">
      <button class="btn" onclick="apiCall('git-push')">GitHub公開反映 (Push)</button>
      <button class="btn" onclick="downloadBackup()">ZIPバックアップ作成</button>
      <button class="btn" onclick="alert('設定編集はサーバー側ファイル（.env等）を直接編集してください')">システム設定編集</button>
      <button class="btn" onclick="restoreUI()">学習データ管理</button>
      <button class="btn" onclick="loadLogs()">ログ表示</button>
    </div>
    <div class="result" id="result-main"></div>
  </div>

  <div class="card">
    <h2>⚠️ 危険操作</h2>
    <p style="font-size:12px;color:#ff9f0a;margin-bottom:10px;">この操作は元に戻せません。事前にバックアップを推奨します。</p>
    <div class="btn-col">
      <button class="btn btn-danger" onclick="apiCall('cleanup')">⚠️ 公開データ削除</button>
      <button class="btn btn-danger" onclick="apiCall('reset')">🚫 システム根本リセット</button>
    </div>
    <div class="result" id="result-danger"></div>
  </div>

  <div class="card">
    <h2>📊 サーバー状態</h2>
    <div class="file-list" id="file-list">読み込み中...</div>
    <h2>📜 実行ログ</h2>
    <div class="log-box" id="log-box">ログを読み込み中...</div>
  </div>
</div>
<script>
function showResult(id, ok, obj) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = 'block';
  el.className = 'result ' + (ok ? 'success' : 'error');
  el.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
}
function apiCall(endpoint) {
  const isDanger = (endpoint === 'cleanup' || endpoint === 'reset');
  const target = isDanger ? 'result-danger' : 'result-main';
  showResult(target, true, '処理中...');
  fetch('/api/' + endpoint, { method: 'POST' })
    .then(r => r.json())
    .then(data => showResult(target, !!data.success, data))
    .catch(err => showResult(target, false, 'エラー: ' + err));
}
function restoreUI() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function() {
    if (!input.files.length) return;
    const fd = new FormData();
    fd.append('file', input.files[0]);
    showResult('result-main', true, 'アップロード中...');
    fetch('/api/restore', { method: 'POST', body: fd })
      .then(r => r.json())
      .then(data => showResult('result-main', !!data.success, data))
      .catch(err => showResult('result-main', false, 'エラー: ' + err));
  };
  input.click();
}
function downloadBackup() {
  showResult('result-main', true, 'バックアップ作成中...');
  fetch('/api/backup', { method: 'POST' })
    .then(r => r.blob())
    .then(blob => {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'keiba_backup_' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '') + '.json';
      document.body.appendChild(a); a.click(); window.URL.revokeObjectURL(url);
      showResult('result-main', true, 'バックアップをダウンロードしました');
    })
    .catch(err => showResult('result-main', false, 'エラー: ' + err));
}
function loadLogs() {
  fetch('/api/logs')
    .then(r => r.json())
    .then(data => {
      document.getElementById('log-box').textContent = (data.logs || []).join('');
    })
    .catch(err => { document.getElementById('log-box').textContent = 'エラー: ' + err; });
}
function loadStatus() {
  fetch('/api/status')
    .then(r => r.json())
    .then(data => {
      const el = document.getElementById('file-list');
      const files = data.data_files || [];
      const commits = data.recent_commits || [];
      let html = '<div>📁 data/ ファイル数: ' + files.length + '</div>';
      files.forEach(f => { html += '<div>・' + f.name + ' (' + f.size + ' bytes)</div>'; });
      html += '<div style="margin-top:6px;">📝 直近コミット:</div>';
      commits.forEach(c => { html += '<div>・' + c + '</div>'; });
      el.innerHTML = html;
      document.getElementById('status-detail').textContent = 'data/' + files.length + '件';
    })
    .catch(() => {});
}
/* ---- Web公開切替 ---- */
function loadWebStatus() {
  fetch('/api/web-status').then(r => r.json()).then(d => {
    document.getElementById('web-status-text').innerHTML = d.published
      ? '🟢 <b style="color:#30d158;">公開中</b> — GitHub Pagesに最新index.htmlが反映されています'
      : '🔴 <b style="color:#ff9f0a;">停止中（メンテナンス画面）</b> — 外部からは閲覧できません';
    document.getElementById('pages-link').href = d.url;
    document.getElementById('btn-publish').disabled = !!d.published;
    document.getElementById('btn-unpublish').disabled = !d.published;
    document.getElementById('btn-publish').style.opacity = d.published ? '0.4' : '1';
    document.getElementById('btn-unpublish').style.opacity = d.published ? '1' : '0.4';
  }).catch(() => {});
}
function webAction(endpoint) {
  const msg = endpoint === 'web-unpublish'
    ? '本当にメンテナンスモードにしますか？（公開URLがメンテナンス画面に変わります）'
    : '本当に公開モードに戻しますか？';
  if (!confirm(msg)) return;
  showResult('result-web', true, '処理中... git push を実行しています');
  fetch('/api/' + endpoint, { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      showResult('result-web', !!data.success, data.success ? '完了しました。公開URLに数分で反映されます: ' + data.url : data);
      loadWebStatus();
    })
    .catch(err => showResult('result-web', false, 'エラー: ' + err));
}
function copyPagesUrl() {
  const url = document.getElementById('pages-link').href;
  navigator.clipboard.writeText(url).then(() => alert('コピーしました: ' + url)).catch(() => prompt('URLをコピー:', url));
}

/* ---- アクセスカウンター ---- */
function loadStats() {
  fetch('/api/stats').then(r => r.json()).then(d => {
    document.getElementById('view-stats').textContent = '👀 閲覧数：累計 ' + (d.total || 0) + '回（本日 ' + (d.today || 0) + '回）';
  }).catch(() => {});
}

/* ---- 競馬情報収集・同期 ---- */
let lastKeibaData = null;
function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function aiTextForItem(it) {
  return '【AI学習】' + it.title + '（' + it.source + '）' + (it.date ? ' ' + it.date : '') + '\n' + it.url;
}
function copyText(text, label) {
  const done = () => alert('コピーしました');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallback());
  } else fallback();
  function fallback() {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
  }
}
function renderKeibaCards(d) {
  const box = document.getElementById('keiba-cards');
  if (!d || (!d.upcoming && !d.results && !d.news)) { box.innerHTML = ''; return; }
  lastKeibaData = d;
  let html = '';
  const groups = [
    ['🏇 直近の注目レース予定・ニュース', d.upcoming, '#30d158'],
    ['🏁 過去1週間の主なレース結果', d.results, '#ff9f0a'],
    ['📰 その他の最新ニュース', d.news, '#0a84ff'],
  ];
  groups.forEach(([label, items, color]) => {
    if (!items || !items.length) return;
    html += '<div style="margin-bottom:12px;"><div style="font-size:12px;font-weight:700;color:' + color + ';margin-bottom:6px;">' + label + '</div>';
    items.slice(0, 12).forEach((it, i) => {
      html += '<div class="news-item" style="background:#252526;border:1px solid #3e3e42;border-radius:6px;padding:8px;margin-bottom:6px;">' +
        '<div style="font-size:12px;color:#fff;margin-bottom:4px;">' + escH(it.title) + '</div>' +
        '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">' +
        '<a href="' + escH(it.url) + '" target="_blank" rel="noopener" style="font-size:11px;color:#64d2ff;">情報元：' + escH(it.source) + '</a>' +
        (it.date ? '<span style="font-size:10px;color:#8e8e93;">' + escH(it.date) + '</span>' : '') +
        (it.note ? '<span style="font-size:10px;color:#ffd60a;">メモ:' + escH(it.note) + '</span>' : '') +
        '<span style="margin-left:auto;display:flex;gap:4px;">' +
        '<button class="btn" style="padding:4px 8px;font-size:10px;" data-news="edit" data-url="' + escH(it.url) + '">✏️ 編集</button>' +
        '<button class="btn" style="padding:4px 8px;font-size:10px;background:#b91c1c;" data-news="del" data-url="' + escH(it.url) + '">🗑️ 削除</button>' +
        '<button class="btn" style="padding:4px 8px;font-size:10px;" data-news="copy" data-url="' + escH(it.url) + '">📋 AI学習用コピー</button>' +
        '</span></div></div>';
    });
    html += '</div>';
  });
  box.innerHTML = html;
  const flat = [];
  groups.forEach(([, items]) => { (items || []).slice(0, 12).forEach(it => flat.push(it)); });
  box.querySelectorAll('button[data-news]').forEach(b => {
    const url = b.dataset.url;
    const act = b.dataset.news;
    const it = flat.find(x => x.url === url);
    if (!it) return;
    if (act === 'copy') b.onclick = () => copyText(aiTextForItem(it), 'AI学習用');
    else if (act === 'edit') b.onclick = () => editNewsItem(it);
    else if (act === 'del') b.onclick = () => deleteNewsItem(it);
  });
}
function editNewsItem(it) {
  const title = prompt('タイトルを編集:', it.title || '');
  if (title === null) return;
  const note = prompt('メモ（任意・空欄で変更なし。削除は「-」と入力）:', it.note === undefined ? '' : it.note);
  if (note === null) return;
  fetch('/api/keiba-edit', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({url: it.url, title: title, note: note === '' ? undefined : (note === '-' ? '' : note)})})
    .then(r => r.json()).then(d => {
      if (d.success) { showResult('result-keiba', true, '編集を保存しました。「📤 閲覧者サイトへ反映」で公開できます'); loadKeibaNews(); }
      else showResult('result-keiba', false, d);
    }).catch(err => showResult('result-keiba', false, 'エラー: ' + err));
}
function deleteNewsItem(it) {
  if (!confirm('このニュースを削除しますか？\n' + (it.title || it.url))) return;
  fetch('/api/keiba-delete', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url: it.url})})
    .then(r => r.json()).then(d => {
      if (d.success) { showResult('result-keiba', true, '削除しました。残り ' + (d.remaining||0) + ' 件'); loadKeibaNews(); }
      else showResult('result-keiba', false, d);
    }).catch(err => showResult('result-keiba', false, 'エラー: ' + err));
}
function keibaUpdate() {
  showResult('result-keiba', true, '外部サイトから情報収集中...（数秒かかります）');
  fetch('/api/keiba-update', { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      if (!data.success) { showResult('result-keiba', false, data); return; }
      showResult('result-keiba', true, '取得完了: ' + data.fetched_at + ' / ' + data.total + '件（直近' + (data.upcoming||[]).length + '・結果' + (data.results||[]).length + '・他' + (data.news||[]).length + '）' + (data.errors && data.errors.length ? '\n一部失敗: ' + data.errors.join(' / ') : ''));
      renderKeibaCards(data);
    })
    .catch(err => showResult('result-keiba', false, 'エラー: ' + err));
}
function syncViewer() {
  if (!confirm('収集済みの最新情報を閲覧サイトへ反映し、GitHubへ公開pushします。よろしいですか？')) return;
  showResult('result-keiba', true, '公開push実行中...');
  fetch('/api/sync-viewer', { method: 'POST' })
    .then(r => r.json())
    .then(data => showResult('result-keiba', !!data.success, data.success ? '反映・公開push完了。数分後に公開URLへ表示されます' : data))
    .catch(err => showResult('result-keiba', false, 'エラー: ' + err));
}
function copyAllAiText() {
  fetch('/api/keiba-ai-text').then(r => r.json()).then(d => {
    if (d.success) copyText(d.text, '全体');
    else alert(d.error || 'AIテキスト未取得');
  }).catch(() => alert('取得失敗'));
}
function loadKeibaNews() {
  fetch('/api/keiba-news').then(r => r.json()).then(d => {
    if (d.success) renderKeibaCards(d);
  }).catch(() => {});
}

loadLogs();
loadStatus();
loadWebStatus();
loadStats();
loadKeibaNews();
setInterval(loadLogs, 5000);
setInterval(loadStatus, 15000);
setInterval(loadStats, 30000);
setInterval(loadKeibaNews, 60000);
</script>
</body>
</html>
