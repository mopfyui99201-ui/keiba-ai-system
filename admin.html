<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競馬AI管理コンソール（管理者専用）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; background: #0f172a; color: #f8fafc; line-height: 1.6; padding: 20px; }
.header { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; box-shadow: 0 4px 15px rgba(220,38,38,0.3); }
.header h1 { color: #fff; font-size: 22px; margin-bottom: 8px; }
.header p { color: #fecaca; font-size: 14px; }
.card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
.card h2 { color: #38bdf8; font-size: 18px; margin-bottom: 16px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
.btn { padding: 10px 18px; border: none; border-radius: 6px; color: #fff; font-weight: 600; cursor: pointer; font-size: 13px; margin-right: 8px; margin-bottom: 8px; transition: all 0.2s; }
.btn-danger { background: #dc2626; }
.btn-danger:hover { background: #b91c1c; }
.btn-warning { background: #f59e0b; }
.btn-warning:hover { background: #d97706; }
.btn-success { background: #28a745; }
.btn-success:hover { background: #1e7e34; }
.btn-info { background: #007acc; }
.btn-info:hover { background: #005a9e; }
.btn-file { background: #6366f1; }
.btn-file:hover { background: #4f46e5; }
.status-box { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 12px; margin-top: 10px; font-family: monospace; font-size: 12px; color: #10b981; height: 200px; overflow-y: auto; }
.input-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.input-row input[type="text"], .input-row input[type="file"] { padding: 8px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 13px; }
.input-row input[type="text"] { flex: 1; min-width: 200px; }
.log-box { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 12px; margin-top: 10px; font-family: monospace; font-size: 11px; color: #94a3b8; height: 150px; overflow-y: auto; }
.warning { color: #fbbf24; font-size: 13px; margin-bottom: 12px; }
.result { margin-top: 10px; padding: 8px; border-radius: 4px; display: none; }
.result.success { background: rgba(40,167,69,0.2); border: 1px solid #28a745; color: #bbf7d0; }
.result.error { background: rgba(220,38,38,0.2); border: 1px solid #dc2626; color: #fecaca; }
</style>
</head>
<body>

<div class="header">
  <h1>⚙️ 競馬AI管理コンソール（管理者専用）</h1>
  <p>localhost専用 - 外部からのアクセスは不可</p>
</div>

<div class="card">
  <h2>🖥️ サーバー・公開サイト管理</h2>
  <div class="warning">⚠️ この操作は公開サイト（GitHub Pages）に影響します</div>
  <button class="btn btn-info" onclick="apiCall('git-push')">🚀 GitHubへプッシュ</button>
  <button class="btn btn-danger" onclick="apiCall('cleanup')">🗑️ 公開データ全削除</button>
  <div class="result" id="result-server"></div>
</div>

<div class="card">
  <h2>💾 システム根本管理</h2>
  <div class="warning">⚠️ リセット操作は元に戻せません。自動バックアップがデスクトップに保存されます</div>
  <button class="btn btn-warning" onclick="apiCall('reset')">🔄 システム根本リセット</button>
  <button class="btn btn-success" onclick="downloadBackup()">📦 学習データバックアップ（JSONダウンロード）</button>
  <div class="input-row">
    <input type="file" id="restore-file" accept=".json">
    <button class="btn btn-info" onclick="restoreBackup()">📥 バックアップ復元</button>
  </div>
  <div class="result" id="result-system"></div>
</div>
<div class="card">
  <h2>🔧 システム修正・稼働チェック</h2>
  <div class="input-row">
    <input type="text" id="setting-file" placeholder="ファイル名 (例: scraper.py)">
  </div>
  <button class="btn btn-info" onclick="saveSetting()">💾 設定保存</button>
  <button class="btn btn-success" onclick="apiCall('logs')">📋 ログ確認</button>
  <div class="result" id="result-setting"></div>
  <div class="log-box" id="log-box"></div>
</div>

<div class="card">
  <h2>📊 システムステータス</h2>
  <button class="btn btn-info" onclick="loadStatus()">🔄 更新</button>
  <div class="status-box" id="status-box">ステータスを取得中...</div>
</div>

<script>
function apiCall(endpoint) {
  const resultDiv = document.getElementById('result-' + endpoint);
  resultDiv.style.display = 'block';
  resultDiv.className = 'result';
  resultDiv.textContent = '処理中...';
  fetch('/api/' + endpoint, { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      resultDiv.className = data.success ? 'result success' : 'result error';
      resultDiv.textContent = JSON.stringify(data, null, 2);
    })
    .catch(err => {
      resultDiv.className = 'result error';
      resultDiv.textContent = 'エラー: ' + err;
    });
}

function downloadBackup() {
  fetch('/api/backup', { method: 'POST' })
    .then(r => r.blob())
    .then(blob => {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'keiba_learn_backup_' + new Date().toISOString().slice(0,16) + '.json';
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
    });
}

function restoreBackup() {
  const fileInput = document.getElementById('restore-file');
  if (!fileInput.files[0]) { alert('ファイルを選択してください'); return; }
  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  fetch('/api/restore', { method: 'POST', body: formData })
    .then(r => r.json())
    .then(data => {
      const resultDiv = document.getElementById('result-system');
      resultDiv.style.display = 'block';
      resultDiv.className = data.success ? 'result success' : 'result error';
      resultDiv.textContent = JSON.stringify(data, null, 2);
    });
}

function saveSetting() {
  const fname = document.getElementById('setting-file').value.trim();
  if (!fname) { alert('ファイル名を入力してください'); return; }
  alert('設定ファイルの直接編集は、サーバー側のファイルを直接編集してください。\n対象: ' + fname);
}

function loadStatus() {
  const box = document.getElementById('status-box');
  box.textContent = '取得中...';
  fetch('/api/status')
    .then(r => r.json())
    .then(data => {
      let text = 'データファイル:\n';
      data.data_files.forEach(function(f) { text += '  ' + f.name + ' (' + f.size + ' バイト)\n'; });
      text += '\n最近のコミット:\n';
      data.recent_commits.forEach(function(c) { text += '  ' + c + '\n'; });
      box.textContent = text;
    })
    .catch(err => { box.textContent = 'エラー: ' + err; });
}

function loadLogs() {
  fetch('/api/logs')
    .then(r => r.json())
    .then(data => {
      const box = document.getElementById('log-box');
      box.textContent = data.logs.join('');
    });
}

loadStatus();
loadLogs();
setInterval(loadLogs, 5000);
</script>
</body>
</html>
